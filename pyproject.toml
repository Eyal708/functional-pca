[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "functional-pca"
version = "0.1.0"
description = "Functional PCA for sparse, irregular, multilevel and multivariate functional data: PACE, two-level FPCA and multivariate FPCA in Python."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Eyal Haluts", email = "eyalhaluts@mail.tau.ac.il" }]
requires-python = ">=3.10"
keywords = [
    "functional data analysis",
    "FPCA",
    "PACE",
    "multivariate FPCA",
    "multilevel FPCA",
    "longitudinal data",
    "sparse data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pandas>=1.5",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
examples = ["jupyter"]
dev = ["pytest>=7", "nbmake>=1.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/Eyal708/functional-pca"
Issues = "https://github.com/Eyal708/functional-pca/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
src = ["src"]
# Third-party code included verbatim (FDApy smoothers), kept as in the original.
extend-exclude = ["src/fpca/_smoothing.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
